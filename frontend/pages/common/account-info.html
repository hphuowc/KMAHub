<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin tài khoản — KMA Hub</title>
  <link rel="icon" type="image/png" href="../../assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/layouts.css" />
  <style>
    body {
      font-family: 'Nunito', var(--font-family);
      background-color: var(--color-bg);
    }
    .account-container {
      width: 100%;
    }
    .account-container.student-mode {
      max-width: 920px;
      margin: 0 auto;
    }
    .profile-hero-card {
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 36px 24px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .profile-hero-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 88px;
      background: linear-gradient(135deg, var(--color-sidebar-dark) 0%, var(--color-sidebar) 55%, var(--color-primary) 100%);
      z-index: 0;
    }
    .profile-hero-card.admin-theme::before {
      background: linear-gradient(135deg, var(--color-sidebar-dark) 0%, var(--color-sidebar) 55%, var(--color-primary) 100%);
    }
    .profile-avatar-large {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-sidebar), var(--color-primary));
      color: #FFFFFF;
      font-size: 34px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 16px auto 16px auto;
      border: 4px solid #FFFFFF;
      box-shadow: var(--shadow-md);
      position: relative;
      z-index: 1;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (max-width: 640px) {
      .info-grid {
        grid-template-columns: 1fr;
      }
    }
    .info-item {
      padding: 14px 16px;
      background: var(--color-bg-muted);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .info-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .info-val {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text-primary);
    }
    .security-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--color-border);
      gap: 12px;
      flex-wrap: wrap;
    }
    .security-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .security-row:first-child {
      padding-top: 0;
    }
    .security-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 240px;
    }
    .security-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .security-desc {
      font-size: 13px;
      color: var(--color-text-muted);
      line-height: 1.4;
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(17, 24, 39, 0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.active {
      display: flex;
    }
    .modal-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
      overflow: hidden;
      animation: modalScaleIn 0.2s ease-out;
    }
  </style>
</head>
<body>

  <!-- Khung gốc được dựng đồng bộ theo đúng từng vai trò (Student Navbar hoặc BTC/Admin Sidebar) -->
  <div id="accountRootShell"></div>

  <!-- Modal Đổi mật khẩu -->
  <div class="modal-backdrop" id="passwordModal">
    <div class="modal-card">
      <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 16px; font-weight: 700; margin: 0;">Đổi mật khẩu tài khoản</h3>
        <button class="btn btn-ghost btn-sm" style="padding: 4px; border-radius: 50%;" onclick="closePasswordModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="changePasswordForm" onsubmit="handlePasswordSubmit(event)">
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">Mật khẩu hiện tại</label>
            <input type="password" class="form-input" placeholder="Nhập mật khẩu hiện tại" required>
          </div>
          <div class="form-group">
            <label class="form-label">Mật khẩu mới</label>
            <input type="password" class="form-input" placeholder="Tối thiểu 8 ký tự" required minlength="8">
          </div>
          <div class="form-group">
            <label class="form-label">Xác nhận mật khẩu mới</label>
            <input type="password" class="form-input" placeholder="Nhập lại mật khẩu mới" required>
          </div>
        </div>
        <div class="card-footer" style="display: flex; justify-content: flex-end; gap: 10px; background: var(--color-bg-muted);">
          <button type="button" class="btn btn-ghost btn-sm" onclick="closePasswordModal()">Hủy</button>
          <button type="submit" class="btn btn-primary btn-sm">Cập nhật mật khẩu</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../assets/js/core/config.js"></script>
  <script src="../../assets/js/core/api.js"></script>
  <script src="../../assets/js/core/icons.js"></script>
  <script src="../../assets/js/core/security.js"></script>
  <script src="../../assets/js/core/notifications.js"></script>
  <script src="../../assets/js/pages/common/account-info.js"></script>
</body>
</html>
