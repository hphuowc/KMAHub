<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập — KMA Hub</title>
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="../../assets/css/layouts.css" />
    <style>
      body {
        font-family: "Nunito", sans-serif;
        background-color: var(--color-bg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .auth-container {
        width: 100%;
        max-width: 960px;
        min-height: 560px;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 20px 44px rgba(122, 20, 24, 0.1);
        overflow: hidden;
        display: grid;
        grid-template-columns: 0.95fr 1.05fr;
        border: 1px solid var(--color-border-rose);
      }
      .auth-banner {
        background: linear-gradient(
          155deg,
          var(--color-sidebar-dark) 0%,
          var(--color-sidebar) 45%,
          var(--color-primary) 100%
        );
        color: #ffffff;
        padding: 48px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .auth-banner::after {
        content: "";
        position: absolute;
        bottom: -50px;
        left: -20%;
        width: 140%;
        height: 190px;
        background: radial-gradient(
          ellipse at center,
          rgba(242, 184, 75, 0.25) 0%,
          rgba(155, 27, 30, 0) 70%
        );
        pointer-events: none;
      }
      .auth-crest-wrap {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        background: #ffffff;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
        margin-bottom: 24px;
        position: relative;
        z-index: 2;
      }
      .auth-crest-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .auth-academy-name {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: var(--color-gold);
        margin-bottom: 10px;
        position: relative;
        z-index: 2;
      }
      .auth-brand-title {
        font-size: 38px;
        font-weight: 900;
        letter-spacing: -0.5px;
        line-height: 1.15;
        margin-bottom: 12px;
        position: relative;
        z-index: 2;
      }
      .auth-brand-title span {
        color: var(--color-gold);
      }
      .auth-brand-tagline {
        font-size: 14.5px;
        color: rgba(255, 255, 255, 0.88);
        line-height: 1.55;
        white-space: nowrap;
        position: relative;
        z-index: 2;
      }
      .auth-banner-footer {
        position: absolute;
        bottom: 22px;
        left: 0;
        right: 0;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.65);
        z-index: 2;
      }
      .auth-form-side {
        padding: 52px 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #ffffff;
      }
      .auth-header {
        margin-bottom: 28px;
      }
      .auth-header h1 {
        font-size: 28px;
        font-weight: 800;
        color: var(--color-text-primary);
        margin-bottom: 6px;
      }
      .auth-header p {
        font-size: 14px;
        color: var(--color-text-secondary);
      }
      .auth-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 16px 0 24px 0;
        font-size: 13px;
      }
      .auth-remember {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--color-text-secondary);
        cursor: pointer;
      }
      .password-input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .password-input-wrap .form-input {
        padding-right: 44px;
      }
      .password-toggle-btn {
        position: absolute;
        right: 10px;
        width: 32px;
        height: 32px;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--color-text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: color 0.15s ease, background-color 0.15s ease;
      }
      .password-toggle-btn:hover {
        color: var(--color-primary);
        background-color: var(--color-bg-rose);
      }
      @media (max-width: 900px) {
        .auth-container {
          grid-template-columns: 1fr;
        }
        .auth-banner {
          padding: 36px 24px 48px;
        }
        .auth-crest-wrap {
          width: 88px;
          height: 88px;
          margin-bottom: 14px;
        }
        .auth-brand-title {
          font-size: 30px;
        }
        .auth-form-side {
          padding: 36px 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-banner">
        <div class="auth-crest-wrap">
          <img
            src="../../assets/images/kma-logo.png"
            alt="Logo Học viện Kỹ thuật Mật mã"
          />
        </div>
        <div class="auth-academy-name">Học viện Kỹ thuật Mật mã</div>
        <div class="auth-brand-title">KMA <span>Hub</span></div>
        <p class="auth-brand-tagline">
          Cổng quản lý sự kiện và điểm danh trực tuyến
        </p>
        <div class="auth-banner-footer">
          © Học viện Kỹ thuật Mật mã
        </div>
      </div>

      <div class="auth-form-side">
        <div class="auth-header">
          <h1>Đăng nhập</h1>
          <p>Sử dụng tài khoản Học viện để truy cập hệ thống</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" id="usernameLabel"
              >Mã sinh viên / Email</label
            >
            <input
              type="text"
              id="usernameInput"
              class="form-input"
              placeholder="Nhập mã sinh viên hoặc email công vụ"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="passwordInput">Mật khẩu</label>
            <div class="password-input-wrap">
              <input
                type="password"
                id="passwordInput"
                class="form-input"
                placeholder="Nhập mật khẩu"
                required
              />
              <button
                type="button"
                class="password-toggle-btn"
                id="togglePasswordBtn"
                onclick="togglePasswordVisibility()"
                aria-label="Hiện mật khẩu"
                title="Hiện mật khẩu"
              >
                <svg
                  id="eyeIconOpen"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  id="eyeIconClosed"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  style="display: none"
                >
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-options">
            <label class="auth-remember">
              <input
                type="checkbox"
                checked
                style="accent-color: var(--color-primary)"
              />
              <span>Ghi nhớ đăng nhập</span>
            </label>
            <a
              href="javascript:void(0)"
              class="action-link"
              onclick="
                alert(
                  'Vui lòng liên hệ Phòng Đào tạo (P.201 - Nhà A1) để được hỗ trợ cấp lại mật khẩu.',
                )
              "
              >Quên mật khẩu?</a
            >
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Đăng nhập
          </button>
        </form>
      </div>
    </div>
    <script src="../../assets/js/core/config.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/icons.js"></script>
    <script src="../../assets/js/core/security.js"></script>
    <script src="../../assets/js/core/notifications.js"></script>
    <script src="../../assets/js/pages/auth/login.js"></script>
  </body>
</html>
